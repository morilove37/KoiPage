[package]
name = "galgame-manager"
version = "0.3.1"
description = "KoiPage - a Galgame and visual novel library manager"
authors = ["morilove37"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "galgame_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# HTTP for external metadata (NextMoe / VNDB / Bangumi), called from
# `src/metadata/` rather than from the frontend. Talking to the upstreams in Rust
# means requests bypass WebView CORS and can set the User-Agent that VNDB and
# Bangumi both require — neither is possible with a browser `fetch`.
#
# Note: `tauri-plugin-http` is deliberately absent. It would only be needed if
# the *frontend* made HTTP calls, and on top of being unused it couples the Rust
# crate and the npm package versions, a mismatch that `tauri build` rejects while
# `cargo check` and `tsc` both stay silent.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# `tokio::join!` fans a metadata search out across providers.
tokio = { version = "1", features = ["macros", "rt"] }
# sqlx / time are also pulled in transitively by tauri-plugin-sql, but Rust
# requires them to be declared directly to be nameable in this crate.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
