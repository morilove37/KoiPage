<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="恋页 KoiPage" />
    <meta name="description" content="恋页 KoiPage — 收藏相遇，续写下一页。你的 Galgame 与视觉小说收藏馆。" />
    <link rel="icon" type="image/svg+xml" href="/brand/koipage.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/koipage-32.png" />
    <link rel="apple-touch-icon" href="/brand/koipage-192.png" />
    <title>恋页 KoiPage · Galgame 管理器</title>
  </head>

  <body>
    <!-- Backdrop for the 液态玻璃 theme. Always present, hidden unless
         <html> carries `.glass` (see `#lg-backdrop` in src/index.css), so no
         component has to mount it and `src/App.tsx` stays untouched.

         `#lg-backdrop-image` is the user's custom wallpaper and stays empty
         here: `src/lib/backdrop.ts` paints it through the `--lg-bg-*` custom
         properties. It sits *below* `.lg-hue`, so the hue rotation that keeps
         the glass tint alive never recolours the user's own picture. -->
    <div id="lg-backdrop" aria-hidden="true">
      <div id="lg-backdrop-image"></div>
      <div class="lg-hue">
        <div class="lg-blobs"></div>
      </div>
      <div class="lg-veil"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
